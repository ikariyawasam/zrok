name: CI
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)

    - name: Download Zrok
      run: |
        $version = (Invoke-RestMethod https://api.github.com/repos/openziti/zrok/releases/latest).tag_name.TrimStart('v')
        $url = "https://github.com/openziti/zrok/releases/download/v$version/zrok_${version}_windows_amd64.tar.gz"
        Write-Host "Downloading zrok v$version..."
        Invoke-WebRequest -Uri $url -OutFile zrok.tar.gz

    - name: Extract Zrok
      run: tar -xvf zrok.tar.gz

    - name: Enable Zrok Environment
      run: .\zrok2.exe enable $env:ZROK_TOKEN
      env:
        ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}

    - name: Start Zrok Share & Keep Alive
      run: |
        Start-Process -FilePath ".\zrok2.exe" `
          -ArgumentList "share private --backend-mode tcpTunnel localhost:3389" `
          -RedirectStandardOutput "zrok_output.txt" `
          -RedirectStandardError "zrok_error.txt" `
          -NoNewWindow

        Write-Host "Waiting for zrok to start..."
        Start-Sleep -Seconds 10

        Write-Host "=== ZROK OUTPUT ==="
        if (Test-Path "zrok_output.txt") {
          Get-Content "zrok_output.txt"
        }
        Write-Host "=== ZROK ERRORS ==="
        if (Test-Path "zrok_error.txt") {
          Get-Content "zrok_error.txt"
        }

        while ($true) {
          Start-Sleep -Seconds 30
          Write-Host "--- $(Get-Date) ---"
          if (Test-Path "zrok_output.txt") {
            Get-Content "zrok_output.txt"
          }
          if (Test-Path "zrok_error.txt") {
            Get-Content "zrok_error.txt"
          }
        }
