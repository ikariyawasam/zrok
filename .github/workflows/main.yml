name: CI
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)

    - name: Download Zrok
      run: |
        $version = (Invoke-RestMethod https://api.github.com/repos/openziti/zrok/releases/latest).tag_name.TrimStart('v')
        $url = "https://github.com/openziti/zrok/releases/download/v$version/zrok_${version}_windows_amd64.tar.gz"
        Write-Host "Downloading zrok v$version..."
        Invoke-WebRequest -Uri $url -OutFile zrok.tar.gz

    - name: Extract Zrok
      run: |
        tar -xvf zrok.tar.gz
        $zrok = Get-ChildItem -Recurse -Filter "zrok.exe" | Select-Object -First 1
        Write-Host "Found zrok.exe at: $($zrok.FullName)"
        if ($zrok.DirectoryName -ne (Get-Location).Path) {
          Copy-Item $zrok.FullName -Destination ".\zrok.exe"
        }
        Write-Host "zrok.exe ready."

    - name: Enable Zrok Environment
      run: .\zrok.exe enable $env:ZROK_TOKEN
      env:
        ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}

    - name: Start Zrok Share & Keep Alive
      run: |
        Start-Process -FilePath ".\zrok.exe" `
          -ArgumentList "share private --backend-mode tcpTunnel localhost:3389" `
          -RedirectStandardOutput "zrok_output.txt" `
          -RedirectStandardError "zrok_error.txt" `
          -NoNewWindow

        Write-Host "Waiting for share token..."
        $timeout = 30
        $elapsed = 0
        while ($elapsed -lt $timeout) {
          Start-Sleep -Seconds 2
          $elapsed += 2
          if (Test-Path "zrok_output.txt") {
            $content = Get-Content "zrok_output.txt" -Raw -ErrorAction SilentlyContinue
            if ($content -match "share token is '([^']+)'") {
              Write-Host "=========================================="
              Write-Host "SHARE TOKEN: $($matches[1])"
              Write-Host "Run on your Mac:"
              Write-Host "  zrok access private $($matches[1])"
              Write-Host "Then RDP to: 127.0.0.1:<port shown>"
              Write-Host "=========================================="
              break
            }
          }
        }

        if (Test-Path "zrok_error.txt") {
          Write-Host "--- zrok errors ---"
          Get-Content "zrok_error.txt"
        }

        while ($true) {
          Start-Sleep -Seconds 60
          Write-Host "Still alive... $(Get-Date)"
        }
